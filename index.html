<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carer Visit Log</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full text-center">
    <h1 class="text-2xl font-bold text-gray-800 mb-2">Carer Visit Log</h1>
    <p class="text-gray-600 mb-6">Scan to check in or check out</p>
    <div id="qrcode" class="flex justify-center my-6"></div>
    <p class="text-sm text-gray-500">Point your camera at the code</p>
  </div>
  <script>
    const url = window.location.origin + window.location.pathname.replace(/index\.html$/, '') + 'form.html';
    new QRCode(document.getElementById("qrcode"), {
      text: url.startsWith('file:') ? 'https://jpmoolman-lab.github.io/carer-log/form.html' : url,
      width: 220,
      height: 220,
      colorDark: "#4f46e5",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
