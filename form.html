<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carer Sign-Out Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8 px-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6 sm:p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Carer Visit Log</h1>
      <p class="text-gray-600 text-sm mt-1">Please fill in your details before leaving</p>
    </div>

    <form id="carerForm" action="https://formsubmit.co/jpmoolman@gmail.com" method="POST" class="space-y-5">
      <!-- Hidden fields for FormSubmit -->
      <input type="hidden" name="_cc" value="jpm@fsace.com.au">
      <input type="hidden" name="_subject" value="New Carer Visit Log">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="thanks.html">
      <input type="text" name="_gotcha" style="display:none">

      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Carer's Name</label>
        <input type="text" id="name" name="Carer Name" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
          placeholder="Enter your full name">
      </div>

      <div>
        <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Date</label>
        <input type="date" id="date" name="Date" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
      </div>

      <div>
        <label for="arrived" class="block text-sm font-medium text-gray-700 mb-1">Time Arrived</label>
        <input type="time" id="arrived" name="Time Arrived" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
      </div>

      <div>
        <label for="planned" class="block text-sm font-medium text-gray-700 mb-1">Planned Leave Time</label>
        <input type="time" id="planned" name="Planned Leave Time" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
      </div>

      <div>
        <label for="actual" class="block text-sm font-medium text-gray-700 mb-1">Actual Sign-out Time</label>
        <input type="time" id="actual" name="Actual Sign-out Time" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-gray-50">
        <p class="text-xs text-gray-500 mt-1">Automatically set to current time. You can adjust if needed.</p>
      </div>

      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md">
        Submit Sign-out
      </button>
    </form>

    <p class="text-xs text-center text-gray-400 mt-6">Your details will be emailed securely to the account holders.</p>
  </div>

  <script>
    // Auto-fill date and actual time
    const today = new Date();
    document.getElementById('date').value = today.toISOString().split('T')[0];

    function pad(n) { return n < 10 ? '0' + n : n; }
    const nowTime = pad(today.getHours()) + ':' + pad(today.getMinutes());
    document.getElementById('actual').value = nowTime;

    // Optional: refresh actual time every minute if page stays open
    setInterval(() => {
      const now = new Date();
      document.getElementById('actual').value = pad(now.getHours()) + ':' + pad(now.getMinutes());
    }, 60000);
  </script>
</body>
</html>
