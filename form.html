<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carer Check-in / Check-out</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8 px-4">
  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl p-6 sm:p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800" id="pageTitle">Carer Visit</h1>
      <p class="text-gray-600 text-sm mt-1" id="pageSubtitle">Enter your details</p>
    </div>

    <!-- Name entry (always shown first if no active session) -->
    <div id="nameSection" class="space-y-5">
      <div>
        <label for="carerName" class="block text-sm font-medium text-gray-700 mb-1">Carer's Name</label>
        <input type="text" id="carerName" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none"
          placeholder="Enter your full name">
      </div>
      <button type="button" id="continueBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md">
        Continue
      </button>
    </div>

    <!-- Check-in Form -->
    <form id="checkinForm" action="https://formsubmit.co/jpmoolman@gmail.com" method="POST" class="space-y-5 hidden">
      <input type="hidden" name="_cc" value="jpm@fsace.com.au">
      <input type="hidden" name="_subject" value="Carer CHECK-IN">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="thanks.html">
      <input type="text" name="_gotcha" style="display:none">

      <input type="hidden" name="Type" value="Check-in">
      <input type="hidden" id="ci_name" name="Carer Name">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Date and Time checked in</label>
        <input type="datetime-local" id="ci_datetime" name="Date and Time checked in" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Scheduled time (booked for)</label>
        <input type="time" id="ci_scheduled" name="Scheduled Time" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Actual check-in time started</label>
        <input type="time" id="ci_actual" name="Actual Check-in Time" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-gray-50">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        <textarea name="Notes" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="Any comments..."></textarea>
      </div>

      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md">
        Submit Check-in
      </button>
    </form>

    <!-- Check-out Form -->
    <form id="checkoutForm" action="https://formsubmit.co/jpmoolman@gmail.com" method="POST" class="space-y-5 hidden">
      <input type="hidden" name="_cc" value="jpm@fsace.com.au">
      <input type="hidden" name="_subject" value="Carer CHECK-OUT">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_next" value="thanks.html">
      <input type="text" name="_gotcha" style="display:none">

      <input type="hidden" name="Type" value="Check-out">
      <input type="hidden" id="co_name" name="Carer Name">
      <input type="hidden" id="co_scheduled_hidden" name="Scheduled Time">

      <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-4">
        <p class="text-sm text-indigo-800"><strong>Carer:</strong> <span id="co_displayName"></span></p>
        <p class="text-sm text-indigo-800 mt-1"><strong>Scheduled time:</strong> <span id="co_displayScheduled"></span></p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Date and Time checked out</label>
        <input type="datetime-local" id="co_datetime" name="Date and Time checked out" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
        <textarea name="Notes" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="Any comments about the visit..."></textarea>
      </div>

      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md">
        Submit Check-out
      </button>
    </form>
  </div>

  <script>
    const nameSection = document.getElementById('nameSection');
    const checkinForm = document.getElementById('checkinForm');
    const checkoutForm = document.getElementById('checkoutForm');
    const continueBtn = document.getElementById('continueBtn');
    const carerNameInput = document.getElementById('carerName');

    function getStorageKey(name) {
      return 'carer_' + name.trim().toLowerCase().replace(/\s+/g, '_');
    }

    function pad(n) { return n < 10 ? '0' + n : n; }

    function setCurrentDateTime(input) {
      const now = new Date();
      const iso = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + 'T' + pad(now.getHours()) + ':' + pad(now.getMinutes());
      input.value = iso;
    }

    function setCurrentTime(input) {
      const now = new Date();
      input.value = pad(now.getHours()) + ':' + pad(now.getMinutes());
    }

    continueBtn.addEventListener('click', () => {
      const name = carerNameInput.value.trim();
      if (!name) {
        alert('Please enter your name');
        return;
      }

      const key = getStorageKey(name);
      const stored = localStorage.getItem(key);

      nameSection.classList.add('hidden');

      if (stored) {
        // Already checked in → show checkout
        const data = JSON.parse(stored);
        document.getElementById('pageTitle').textContent = 'Check-out';
        document.getElementById('pageSubtitle').textContent = 'Confirm your departure';

        document.getElementById('co_name').value = name;
        document.getElementById('co_displayName').textContent = name;
        document.getElementById('co_scheduled_hidden').value = data.scheduled || '';
        document.getElementById('co_displayScheduled').textContent = data.scheduled || 'Not set';

        setCurrentDateTime(document.getElementById('co_datetime'));
        checkoutForm.classList.remove('hidden');
      } else {
        // New check-in
        document.getElementById('pageTitle').textContent = 'Check-in';
        document.getElementById('pageSubtitle').textContent = 'Start your visit';

        document.getElementById('ci_name').value = name;
        setCurrentDateTime(document.getElementById('ci_datetime'));
        setCurrentTime(document.getElementById('ci_actual'));

        checkinForm.classList.remove('hidden');
      }
    });

    // On successful check-in, store the data
    checkinForm.addEventListener('submit', (e) => {
      const name = document.getElementById('ci_name').value;
      const scheduled = document.getElementById('ci_scheduled').value;
      const key = getStorageKey(name);
      localStorage.setItem(key, JSON.stringify({
        name: name,
        scheduled: scheduled,
        checkedInAt: new Date().toISOString()
      }));
    });

    // On successful check-out, clear the data
    checkoutForm.addEventListener('submit', (e) => {
      const name = document.getElementById('co_name').value;
      const key = getStorageKey(name);
      localStorage.removeItem(key);
    });
  </script>
</body>
</html>
